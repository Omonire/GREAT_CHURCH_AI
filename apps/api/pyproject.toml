[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "great-church-ai-api"
version = "0.1.0"
description = "Realtime API foundation for Great Church AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/church_ai_api"]
